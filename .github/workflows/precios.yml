name: Actualizar precios

# Descarga los precios de la web de los supermercados una vez al día y los
# publica en la app (docs/prices). La app los carga al abrirse.
on:
  schedule:
    - cron: "23 4 * * *" # cada día a las 04:23 UTC (05:23/06:23 en España)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar precios
        run: node scripts/prices/fetch.mjs
        env:
          MERCADONA_WH: mad1
      - name: Publicar si han cambiado
        run: |
          git config user.name "mesa-precios[bot]"
          git config user.email "mesa-precios@users.noreply.github.com"
          git add public/prices docs/prices
          if git diff --cached --quiet; then
            echo "Sin cambios de precios."
          else
            git commit -m "Precios actualizados $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash
            git push
          fi
